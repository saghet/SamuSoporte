version: '3.8'

services:
  opensupport-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    container_name: opensupport-relay
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
