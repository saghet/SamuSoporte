[Security]
# OpenSupport Enterprise Hardening & Security Policy Configuration

# Criptografía y Cifrado E2EE
crypto.protocol = "Noise_NN_25519_ChaChaPoly_BLAKE2s"
crypto.pfs_enabled = true
crypto.enforce_sas_verification = true

# Políticas Zero Trust de Sesión
session.require_explicit_user_consent = true
session.unattended_access_enabled = false
session.temp_code_ttl_seconds = 900
session.auto_disconnect_on_lock = true

# Protección contra Malware y Transferencia de Archivos
file_transfer.enabled = true
file_transfer.max_file_size_bytes = 104857600 # 100 MB
file_transfer.blocked_extensions = ["exe", "bat", "cmd", "vbs", "ps1", "scr", "pif", "com", "msi", "reg", "dll"]
file_transfer.enforce_sha256_verification = true

# Auditoría Inmutable
audit.tamper_evident_chain = true
audit.log_destination = "C:\\ProgramData\\OpenSupport\\audit.jsonl"
audit.export_syslog_enabled = false

# UAC y Elevación en Windows
windows.uac_bypass_protection = true
windows.block_untrusted_drivers = true
windows.show_persistent_indicator = true
