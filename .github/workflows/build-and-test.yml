name: CI - Build and Test

on:
  push:
    branches: [ main, 'release/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  rust-validation:
    name: Rust Crates (Build & Test)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Workspace Compilation
        run: cargo check --workspace --verbose

      - name: Execute Workspace Test Suite
        run: cargo test --workspace --verbose

  dotnet-validation:
    name: .NET 10 Desktop & Service (Build)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore OpenSupport.slnx

      - name: Build Desktop Client (Release)
        run: dotnet build src/OpenSupport.Desktop/OpenSupport.Desktop.csproj -c Release --no-restore

      - name: Build Service Worker (Release)
        run: dotnet build src/OpenSupport.Service/OpenSupport.Service.csproj -c Release --no-restore
